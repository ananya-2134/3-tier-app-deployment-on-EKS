apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mern-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      initContainers:
        - name: wait-for-backend
          image: busybox
          command:
            - sh
            - -c
            - |
              until nc -z backend 5000; do
                echo "Waiting for Backend..."
                sleep 2
              done

      containers:

        - name: frontend
          image: 360477615168.dkr.ecr.eu-north-1.amazonaws.com/mern-frontend:v3
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-logs
              mountPath: /var/log/nginx

        - name: frontend-logger
          image: busybox
          command: ["sh","-c","tail -n+1 -F /var/log/nginx/access.log"]
          volumeMounts:
            - name: nginx-logs
              mountPath: /var/log/nginx

      volumes:
        - name: nginx-logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: mern-app
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
